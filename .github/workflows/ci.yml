name: CI

on:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  workspace:
    name: Workspace checks
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 45

    steps:
      - name: Install system dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            build-essential \
            ca-certificates \
            curl \
            dbus \
            git \
            jq \
            libgtk-4-dev \
            libgtk4-layer-shell-dev \
            pkg-config \
            shellcheck \
            xauth \
            xvfb \
            zstd

      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Trust checked-out repository
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.96.1 --profile minimal --component rustfmt,clippy
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          source "${HOME}/.cargo/env"
          rustup default 1.96.1
          cargo install cargo-audit --locked --version 0.22.0
          cargo install shellharden --locked --version 4.3.2

      - name: Cache Cargo state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            target
          key: debian-trixie-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            debian-trixie-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check shipped shell scripts
        run: |
          set -euo pipefail
          shellcheck \
            scripts/package-release.sh \
            tests/package-release.sh \
            tests/check-no-personal-paths.sh \
            crates/unixnotis-core/assets/scripts/unixnotis-blue-light-lib \
            crates/unixnotis-core/assets/scripts/unixnotis-blue-light-state \
            crates/unixnotis-core/assets/scripts/unixnotis-blue-light-on \
            crates/unixnotis-core/assets/scripts/unixnotis-blue-light-off
          shellharden --check \
            scripts/package-release.sh \
            tests/package-release.sh \
            tests/check-no-personal-paths.sh

      - name: Check tracked paths for personal data
        run: tests/check-no-personal-paths.sh

      - name: Test release packaging helpers
        run: tests/package-release.sh

      - name: Run workspace tests
        run: xvfb-run -a dbus-run-session -- cargo test --workspace --all-targets --all-features

      - name: Run dependency audit
        run: cargo audit --deny warnings

      - name: Build release package
        run: scripts/package-release.sh "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "unixnotis-core") | .version')"

      - name: Run strict clippy
        # Restriction is intentionally selected per lint because Clippy rejects the blanket group
        run: >
          cargo clippy --all-targets --all-features --
          -D warnings
          -W clippy::pedantic
          -W clippy::nursery
          -W clippy::undocumented_unsafe_blocks
          -W clippy::multiple_unsafe_ops_per_block
          -W clippy::mem_forget
          -W clippy::unnecessary_safety_comment
          -W clippy::unnecessary_safety_doc
          -W clippy::allow_attributes_without_reason
          -W clippy::allow_attributes
          -W clippy::missing_assert_message
          -W clippy::map_err_ignore
          -W clippy::unwrap_used
          -W clippy::unwrap_in_result
          -W clippy::cfg_not_test
          -W clippy::cast_ptr_alignment
          -W clippy::transmute_ptr_to_ptr
          -W clippy::fn_to_numeric_cast_any
          -W clippy::as_pointer_underscore
          -W clippy::lossy_float_literal

      - name: Check patch whitespace
        run: git diff --check
