name: CI

on:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  workspace:
    name: Workspace checks
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 45

    steps:
      - name: Install system dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            build-essential \
            ca-certificates \
            curl \
            dbus \
            git \
            jq \
            libgtk-4-dev \
            libgtk4-layer-shell-dev \
            pkg-config \
            shellcheck \
            xauth \
            xvfb \
            zstd

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.96.1 --profile minimal --component rustfmt,clippy
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          source "${HOME}/.cargo/env"
          rustup default 1.96.1
          cargo install cargo-audit --locked --version 0.22.0

      - name: Cache Cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            target
          key: debian-trixie-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            debian-trixie-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check shipped shell scripts
        run: |
          set -euo pipefail
          shellcheck \
            scripts/package-release.sh \
            crates/unixnotis-core/assets/scripts/unixnotis-blue-light-lib \
            crates/unixnotis-core/assets/scripts/unixnotis-blue-light-state \
            crates/unixnotis-core/assets/scripts/unixnotis-blue-light-on \
            crates/unixnotis-core/assets/scripts/unixnotis-blue-light-off

      - name: Run workspace tests
        run: xvfb-run -a dbus-run-session -- cargo test --workspace --all-features

      - name: Run dependency audit
        run: cargo audit --deny warnings

      - name: Build release package
        run: scripts/package-release.sh "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "unixnotis-core") | .version')"

      - name: Run strict clippy
        run: >
          cargo clippy --all-targets --all-features --
          -D warnings
          -W clippy::pedantic
          -W clippy::nursery
