name: Mutation testing

on:
  workflow_dispatch:
    inputs:
      package:
        description: Cargo package to mutate, such as unixnotis-installer. Leave empty for workspace.
        required: false
        type: string
      file:
        description: Single Rust file to mutate. Leave empty unless reviewing one risky file.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  mutation:
    name: Cargo mutants
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 120

    steps:
      - name: Install system dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            build-essential \
            ca-certificates \
            curl \
            git \
            libgtk-4-dev \
            libgtk-layer-shell-dev \
            pkg-config

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          source "${HOME}/.cargo/env"
          rustup default stable

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run mutation tests
        env:
          MUTATION_PACKAGE: ${{ inputs.package }}
          MUTATION_FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail

          if [ -n "${MUTATION_PACKAGE}" ] && [ -n "${MUTATION_FILE}" ]; then
            echo "Choose either package or file, not both" >&2
            exit 1
          fi

          if [ -n "${MUTATION_FILE}" ]; then
            cargo mutants -f "${MUTATION_FILE}"
          elif [ -n "${MUTATION_PACKAGE}" ]; then
            cargo mutants -p "${MUTATION_PACKAGE}"
          else
            cargo mutants --workspace
          fi
