name: Release Package

on:
  # Release packaging is manual so maintainers can write the public changelog by hand
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package, such as v1.1.0
        required: true
        type: string

# Jobs opt into only the token capabilities used by their own phase
permissions: {}

concurrency:
  # A release tag should produce one archive set, so do not cancel a run already packaging it
  group: release-package-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DEBIAN_SNAPSHOT: 20260720T000000Z
  RUSTUP_INIT_VERSION: 1.28.2
  RUSTUP_INIT_SHA256: 20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Build release tarball
    runs-on: ubuntu-24.04
    container: debian:trixie-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Validate release tag input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'release tag must look like v1.1.0: %s\n' "$RELEASE_TAG" >&2
            exit 2
          fi
          if [[ "$GITHUB_REF" != "refs/tags/${RELEASE_TAG}" ]]; then
            printf 'workflow ref %s must match release tag %s\n' "$GITHUB_REF" "$RELEASE_TAG" >&2
            exit 2
          fi

      - name: Install system dependencies
        run: |
          set -euo pipefail
          # Immutable snapshots keep package resolution stable across release reruns
          rm -f /etc/apt/sources.list
          # The slim image bootstraps without a CA bundle; InRelease signatures still authenticate the immutable index
          printf '%s\n' \
            'Types: deb' \
            "URIs: http://snapshot.debian.org/archive/debian/${DEBIAN_SNAPSHOT}" \
            'Suites: trixie trixie-updates' \
            'Components: main' \
            'Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg' \
            '' \
            'Types: deb' \
            "URIs: http://snapshot.debian.org/archive/debian-security/${DEBIAN_SNAPSHOT}" \
            'Suites: trixie-security' \
            'Components: main' \
            'Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg' \
            > /etc/apt/sources.list.d/debian.sources
          # Snapshot signatures are expected to be expired when an old release is rebuilt
          printf '%s\n' 'Acquire::Check-Valid-Until "false";' \
            > /etc/apt/apt.conf.d/99snapshot
          apt-get update
          # Bootstrap the trust store over the signed snapshot index
          apt-get install -y --no-install-recommends ca-certificates
          sed -i 's#http://snapshot.debian.org#https://snapshot.debian.org#g' \
            /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            build-essential \
            curl \
            gettext-base \
            git \
            libgtk-4-dev \
            libgtk4-layer-shell-dev \
            pkg-config \
            python3 \
            shellcheck \
            xz-utils \
            zstd

      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Verify release source commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse "${tag_ref}^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$GITHUB_SHA" || "$checked_out_commit" != "$GITHUB_SHA" ]]; then
            printf 'release tag, workflow commit, and checkout must resolve to one commit\n' >&2
            exit 2
          fi

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup_init="${RUNNER_TEMP}/rustup-init"
          curl --proto '=https' --tlsv1.2 -fsS \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_INIT_VERSION}/x86_64-unknown-linux-gnu/rustup-init" \
            -o "$rustup_init"
          printf '%s  %s\n' "$RUSTUP_INIT_SHA256" "$rustup_init" \
            | sha256sum --check --strict
          chmod 0755 "$rustup_init"
          "$rustup_init" \
            -y \
            --profile minimal \
            --default-toolchain 1.96.1 \
            --no-modify-path
          rm -f "$rustup_init"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          source "${HOME}/.cargo/env"

      - name: Check packaging script
        run: |
          shellcheck \
            scripts/package-release.sh \
            tests/package-release.sh \
            tests/check-release-hardening.sh \
            tests/check-no-personal-paths.sh
          tests/check-no-personal-paths.sh
          tests/check-release-hardening.sh
          tests/package-release.sh

      - name: Build package archive
        env:
          # Environment transport prevents workflow input from becoming Bash source text
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The packager also binds the requested tag to Cargo's workspace version
          scripts/package-release.sh "$RELEASE_TAG"

      - name: Upload unsigned package archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unixnotis-${{ inputs.tag }}-unsigned
          path: |
            dist/*.tar.zst
            dist/*.sha256
          if-no-files-found: error

  sign:
    name: Sign and attest release tarball
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Only this job can request the short-lived signing identity
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download unsigned package archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unixnotis-${{ inputs.tag }}-unsigned
          path: dist

      - name: Install artifact signer
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.2

      - name: Sign package files
        run: |
          set -euo pipefail
          for artifact in dist/*.tar.zst dist/*.sha256; do
            # Each bundle carries the certificate, signature, and transparency proof
            cosign sign-blob \
              --yes \
              --bundle "${artifact}.sigstore.json" \
              "$artifact"
          done

      - name: Attest package provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            dist/*.tar.zst
            dist/*.sha256

      - name: Upload signed package archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unixnotis-${{ inputs.tag }}-release
          path: |
            dist/*.tar.zst
            dist/*.sha256
            dist/*.sigstore.json
          if-no-files-found: error
