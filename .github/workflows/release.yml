name: Release Package

on:
  # Release packaging is manual so maintainers can write the public changelog by hand
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package, such as v1.1.0
        required: true
        type: string

permissions:
  # The workflow builds archives only; publishing a GitHub Release stays a manual action
  contents: read

concurrency:
  # A release tag should produce one archive set, so do not cancel a run already packaging it
  group: release-package-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Build release tarball
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 45

    steps:
      - name: Install system dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            build-essential \
            ca-certificates \
            curl \
            git \
            libgtk-4-dev \
            libgtk4-layer-shell-dev \
            pkg-config \
            shellcheck \
            xz-utils \
            zstd

      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          source "${HOME}/.cargo/env"
          rustup default 1.96.1
          cargo install shellharden --locked --version 4.3.2

      - name: Check packaging script
        run: |
          shellcheck \
            scripts/package-release.sh \
            tests/package-release.sh \
            tests/check-no-personal-paths.sh
          shellharden --check \
            scripts/package-release.sh \
            tests/package-release.sh \
            tests/check-no-personal-paths.sh
          tests/check-no-personal-paths.sh
          tests/package-release.sh

      - name: Build package archive
        # The script checks that Cargo's version matches the requested release tag
        env:
          # Environment transport prevents workflow input from becoming Bash source text
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'release tag must look like v1.1.0: %s\n' "$RELEASE_TAG" >&2
            exit 2
          fi
          scripts/package-release.sh "$RELEASE_TAG"

      - name: Upload package archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unixnotis-${{ inputs.tag }}-release
          path: |
            dist/*.tar.zst
            dist/*.sha256
          if-no-files-found: error
